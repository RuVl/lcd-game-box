[env]
framework = arduino
build_flags = -I src
lib_deps =
    gyverlibs/EncButton@^3.7.6

; Arduino UNO: Mario, Tetris, Snake, Dino Run (все игры в 32 КБ не влезают)
[env:uno]
platform = atmelavr
board = uno
; -mcall-prologues: общие пролог/эпилог функций вместо копии в каждой - около 1 КБ Flash
build_flags = ${env.build_flags} -mcall-prologues
lib_deps =
    ${env.lib_deps}
    arduino-libraries/LiquidCrystal@^1.0.7

; Arduino UNO: все аркады без Mario
[env:uno_arcade]
extends = env:uno
build_flags = ${env:uno.build_flags} -D GAMEBOX_UNO_ARCADE

; Wemos D1 mini (ESP8266): все игры, Wi-Fi, обновления
[env:d1_mini]
platform = espressif8266
board = d1_mini
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    matmunk/LiquidCrystal_74HC595@^1.0.0
    gyverlibs/SimplePortal@^1.2
    gyverlibs/AutoOTA@^1.2.0

; Wemos D1 mini: прошивка по Wi-Fi
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = lcd-game-box.local
